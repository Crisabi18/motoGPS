<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoGPS - Usuario</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet" href="style.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #0f172a
    );

    color:white;

    overflow-x:hidden;
}

/* Luces decorativas */

body::before{

    content:"";

    position:fixed;

    width:350px;
    height:350px;

    background:#3b82f6;

    border-radius:50%;

    top:-150px;
    left:-100px;

    filter:blur(120px);

    opacity:.35;

}

body::after{

    content:"";

    position:fixed;

    width:350px;
    height:350px;

    background:#22c55e;

    border-radius:50%;

    bottom:-100px;
    right:-100px;

    filter:blur(120px);

    opacity:.35;

}

.container{

    width:min(1100px,95%);

    margin:auto;

    padding:25px;

    position:relative;

    z-index:5;

}


</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🏍️ MotoGPS</h1>

        <p>
            Encuentra ayuda para tu moto
            cuando más la necesitas.
        </p>

    </div>

    <div class="card">

        <h2>📍 Buscar talleres cercanos</h2>

        <p>
            Localiza talleres, servicios de
            remolque y asistencia cercana.
        </p>

        <div class="acciones">

            <button onclick="buscarTalleres()">
                🔍 Buscar talleres
            </button>

            <!-- <button onclick="alternarMapa()">
                🗺️ Cambiar vista
            </button> -->

        </div>

    </div>

    <div id="resultado"></div>

    <button style="margin-top:20px;" onclick="window.location.href='index.html'">
        🏠 Volver al inicio
    </button>

</div>

<script src="app.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>

</html>
