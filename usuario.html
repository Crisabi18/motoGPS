<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoGPS - Usuario</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #0f172a
    );

    color:white;

    overflow-x:hidden;
}

/* Luces decorativas */

body::before{

    content:"";

    position:fixed;

    width:350px;
    height:350px;

    background:#3b82f6;

    border-radius:50%;

    top:-150px;
    left:-100px;

    filter:blur(120px);

    opacity:.35;

}

body::after{

    content:"";

    position:fixed;

    width:350px;
    height:350px;

    background:#22c55e;

    border-radius:50%;

    bottom:-100px;
    right:-100px;

    filter:blur(120px);

    opacity:.35;

}

.container{

    width:min(1100px,95%);

    margin:auto;

    padding:25px;

    position:relative;

    z-index:5;

}

.header{

    text-align:center;

    margin-bottom:30px;
}

.header h1{

    font-size:3rem;

    margin-bottom:10px;
}

.header p{

    color:#cbd5e1;
}

/* Card principal */

.card{

    background:
    rgba(255,255,255,.08);

    backdrop-filter:
    blur(20px);

    border:
    1px solid
    rgba(255,255,255,.15);

    border-radius:25px;

    padding:25px;

    margin-bottom:25px;
}

.acciones{

    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;

    margin-top:20px;
}

button{

    border:none;

    cursor:pointer;

    color:white;

    padding:14px 22px;

    border-radius:12px;

    transition:.25s;

    background:
    rgba(255,255,255,.10);

    border:
    1px solid
    rgba(255,255,255,.15);

    backdrop-filter:
    blur(10px);
}

button:hover{

    transform:translateY(-2px);

    background:
    rgba(255,255,255,.18);
}

#resultado{

    margin-top:20px;
}

#resultado > div{

    background:
    rgba(255,255,255,.08);

    backdrop-filter:
    blur(20px);

    border:
    1px solid
    rgba(255,255,255,.15);

    border-radius:20px;

    padding:15px;

    margin-bottom:15px;
}

#resultado h2,
#resultado h3{

    margin-bottom:10px;
}

#resultado p{

    margin-bottom:8px;

    color:#e2e8f0;
}

#mapa{

    width:100%;
    height:500px;

    border-radius:20px;

    overflow:hidden;

    margin-top:15px;
}

.estado{

    color:#22c55e;

    font-weight:bold;

    margin-top:10px;
}

@media(max-width:700px){

    .header h1{

        font-size:2rem;
    }

    .acciones{

        flex-direction:column;
    }

    button{

        width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🏍️ MotoGPS</h1>

        <p>
            Encuentra ayuda para tu moto
            cuando más la necesitas.
        </p>

    </div>

    <div class="card">

        <h2>📍 Buscar talleres cercanos</h2>

        <p>
            Localiza talleres, servicios de
            remolque y asistencia cercana.
        </p>

        <div class="acciones">

            <button onclick="buscarTalleres()">
                🔍 Buscar talleres
            </button>

            <!-- <button onclick="alternarMapa()">
                🗺️ Cambiar vista
            </button> -->

        </div>

    </div>

    <div id="resultado"></div>

</div>

<script src="app.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>

</html>
