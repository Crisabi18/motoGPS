<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css"/>
<title>MotoGPS</title>

<style>



</style>

</head>

<body>

<div class="container">

    <div class="logo">

        <h1>🏍️ MotoGPS</h1>

        <p>
            Plataforma de asistencia para motociclistas
        </p>

    </div>

    <div class="cards">

        <div
            class="card"
            onclick="location.href='usuario.html'"
        >

            <div class="icono">
                👤
            </div>

            <h2>Soy Usuario</h2>

            <p>
                Busca talleres cercanos,
                solicita auxilio,
                encuentra refacciones y
                recibe asistencia en carretera.
            </p>

        </div>

        <div
            class="card"
            onclick="location.href='taller.html'"
        >

            <div class="icono">
                🔧
            </div>

            <h2>Soy Taller</h2>

            <p>
                Registra tu taller,
                muestra tus servicios,
                administra tu información
                y llega a más motociclistas.
            </p>

        </div>

    </div>

    <div class="admin">

        <button
            onclick="location.href='admin.html'"
        >
            👑 Administrador
        </button>

    </div>

</div>

</body>
</html>
